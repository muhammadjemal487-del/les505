<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Georgia', serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .messages {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .message {
            position: absolute;
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff1493;
            animation: floatMessage 8s ease-in-out infinite;
            opacity: 0.9;
            white-space: nowrap;
        }

        @keyframes floatMessage {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            25% { transform: translateY(-15px) rotate(2deg); opacity: 1; }
            50% { transform: translateY(-5px) rotate(-1deg); opacity: 0.9; }
            75% { transform: translateY(-20px) rotate(1deg); opacity: 1; }
        }

        .title {
            position: fixed;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
            color: #fff;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493, 0 0 60px #c71585;
            animation: pulse 2s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        .subtitle {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
            color: #fff;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
            animation: fadeInOut 3s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .music-note {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            color: #ff69b4;
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 0 0 10px #ff69b4;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="title">&#10024; HAPPY BIRTHDAY &#10024;</div>

    <div class="messages" id="messages"></div>

    <div class="subtitle">&#10084;&#65039; Mi Amor Eterno &#10084;&#65039;</div>

    <div class="music-note" id="musicBtn">&#127925;</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Particles
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.color = `hsla(${320 + Math.random() * 40}, 100%, ${50 + Math.random() * 30}%, ${this.opacity})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Heart shape function
        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        }

        // Heart particles
        class HeartParticle {
            constructor() {
                this.t = Math.random() * Math.PI * 2;
                this.scale = 8 + Math.random() * 2;
                this.baseX = width / 2 + heartX(this.t) * this.scale;
                this.baseY = height / 2 + heartY(this.t) * this.scale;
                this.x = this.baseX;
                this.y = this.baseY;
                this.size = Math.random() * 2.5 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.02 + 0.01;
                this.radius = Math.random() * 5;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update(time) {
                this.angle += this.speed;
                this.x = this.baseX + Math.cos(this.angle) * this.radius;
                this.y = this.baseY + Math.sin(this.angle) * this.radius;
                this.opacity = 0.5 + 0.5 * Math.sin(time * this.pulseSpeed + this.pulsePhase);
            }

            draw() {
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                gradient.addColorStop(0, `rgba(255, 105, 180, ${this.opacity})`);
                gradient.addColorStop(0.5, `rgba(255, 20, 147, ${this.opacity * 0.6})`);
                gradient.addColorStop(1, `rgba(199, 21, 133, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        // Shooting stars
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = 0;
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 8 + 4;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
                this.opacity = 1;
                this.active = false;
                this.timer = Math.random() * 300 + 100;
            }

            update() {
                if (!this.active) {
                    this.timer--;
                    if (this.timer <= 0) this.active = true;
                    return;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.01;

                if (this.opacity <= 0 || this.x > width || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                if (!this.active) return;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                const gradient = ctx.createLinearGradient(
                    this.x, this.y,
                    this.x - Math.cos(this.angle) * this.length,
                    this.y - Math.sin(this.angle) * this.length
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(255, 105, 180, 0)`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Initialize
        const particles = [];
        const heartParticles = [];
        const shootingStars = [];

        for (let i = 0; i < 150; i++) {
            particles.push(new Particle());
        }

        for (let i = 0; i < 200; i++) {
            heartParticles.push(new HeartParticle());
        }

        for (let i = 0; i < 3; i++) {
            shootingStars.push(new ShootingStar());
        }

        // Floating messages
        const loveMessages = [
            'Te Amo ❤️',
            'Eres Magia ✨',
            'Mi Amor Eterno 💕',
            'Feliz Cumpleaños 🎂',
            'Te Adoro 💖',
            'Happy Birthday 🎉',
            'Eres Mi Todo 💗',
            'CUMPLEAÑOS 🎈'
        ];

        const messagesContainer = document.getElementById('messages');

        function createFloatingMessages() {
            loveMessages.forEach((msg, i) => {
                const el = document.createElement('div');
                el.className = 'message';
                el.textContent = msg;
                el.style.left = `${10 + Math.random() * 70}%`;
                el.style.top = `${15 + Math.random() * 65}%`;
                el.style.animationDelay = `${i * 1}s`;
                el.style.fontSize = `${0.9 + Math.random() * 0.8}rem`;
                messagesContainer.appendChild(el);
            });
        }

        createFloatingMessages();

        // Heart glow effect
        let glowIntensity = 0;
        let glowDirection = 1;

        // Animation loop
        let time = 0;
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Update glow
            glowIntensity += 0.02 * glowDirection;
            if (glowIntensity >= 1 || glowIntensity <= 0) glowDirection *= -1;

            // Draw heart glow
            const centerX = width / 2;
            const centerY = height / 2;
            const glowGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
            glowGradient.addColorStop(0, `rgba(255, 20, 147, ${0.1 * glowIntensity})`);
            glowGradient.addColorStop(0.5, `rgba(199, 21, 133, ${0.05 * glowIntensity})`);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, width, height);

            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Update and draw heart particles
            heartParticles.forEach(p => {
                p.update(time);
                p.draw();
            });

            // Update and draw shooting stars
            shootingStars.forEach(s => {
                s.update();
                s.draw();
            });

            time++;
            requestAnimationFrame(animate);
        }

        animate();

        // Background music (optional - user clicks to play)
        const musicBtn = document.getElementById('musicBtn');
        let audioPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (!audioPlaying) {
                musicBtn.textContent = '🔊';
                audioPlaying = true;
            } else {
                musicBtn.textContent = '🎵';
                audioPlaying = false;
            }
        });
    </script>
</body>
</html>

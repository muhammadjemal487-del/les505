<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10;
            min-width: 360px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .bears {
            position: relative;
            width: 200px;
            height: 180px;
            margin: 0 auto 20px;
        }

        /* Brown Bear */
        .bear-brown {
            position: absolute;
            left: 30px;
            bottom: 10px;
        }

        .bear-brown .head {
            width: 80px;
            height: 75px;
            background: #8B6914;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            z-index: 2;
        }

        .bear-brown .ear {
            width: 28px;
            height: 28px;
            background: #8B6914;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            z-index: 1;
        }

        .bear-brown .ear.left { left: 2px; }
        .bear-brown .ear.right { right: 2px; }

        .bear-brown .ear-inner {
            width: 16px;
            height: 16px;
            background: #D4A030;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            left: 6px;
        }

        .bear-brown .face {
            width: 50px;
            height: 35px;
            background: #D4A030;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            left: 15px;
        }

        .bear-brown .eye {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 28px;
        }

        .bear-brown .eye.left { left: 18px; }
        .bear-brown .eye.right { right: 18px; }

        .bear-brown .nose {
            width: 10px;
            height: 7px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            bottom: 22px;
            left: 35px;
        }

        .bear-brown .mouth {
            width: 20px;
            height: 10px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 12px;
            left: 30px;
        }

        .bear-brown .blush {
            width: 14px;
            height: 8px;
            background: rgba(255, 130, 130, 0.6);
            border-radius: 50%;
            position: absolute;
            bottom: 18px;
        }

        .bear-brown .blush.left { left: 8px; }
        .bear-brown .blush.right { right: 8px; }

        .bear-brown .body {
            width: 70px;
            height: 50px;
            background: #8B6914;
            border-radius: 35px 35px 20px 20px;
            position: relative;
            top: -5px;
            left: 5px;
        }

        .bear-brown .arm {
            width: 25px;
            height: 40px;
            background: #8B6914;
            border-radius: 12px;
            position: absolute;
        }

        .bear-brown .arm.left {
            left: -12px;
            top: 5px;
            transform: rotate(20deg);
        }

        .bear-brown .arm.right {
            right: -12px;
            top: 5px;
            transform: rotate(-30deg);
            z-index: 5;
        }

        /* White Bear */
        .bear-white {
            position: absolute;
            right: 25px;
            bottom: 10px;
        }

        .bear-white .head {
            width: 75px;
            height: 70px;
            background: #f5f5f5;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            z-index: 2;
            border: 1px solid #e0e0e0;
        }

        .bear-white .ear {
            width: 25px;
            height: 25px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 50%;
            position: absolute;
            top: -8px;
            z-index: 1;
        }

        .bear-white .ear.left { left: 4px; }
        .bear-white .ear.right { right: 4px; }

        .bear-white .ear-inner {
            width: 14px;
            height: 14px;
            background: #ffcdd2;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .bear-white .face {
            width: 45px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
            left: 15px;
        }

        .bear-white .eye {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 25px;
        }

        .bear-white .eye.left { left: 17px; }
        .bear-white .eye.right { right: 17px; }

        .bear-white .nose {
            width: 9px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
            left: 33px;
        }

        .bear-white .mouth {
            width: 18px;
            height: 9px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 12px;
            left: 28px;
        }

        .bear-white .blush {
            width: 13px;
            height: 7px;
            background: rgba(255, 130, 130, 0.5);
            border-radius: 50%;
            position: absolute;
            bottom: 16px;
        }

        .bear-white .blush.left { left: 7px; }
        .bear-white .blush.right { right: 7px; }

        .bear-white .body {
            width: 65px;
            height: 45px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 32px 32px 18px 18px;
            position: relative;
            top: -5px;
            left: 5px;
        }

        .bear-white .arm {
            width: 22px;
            height: 38px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 11px;
            position: absolute;
        }

        .bear-white .arm.left {
            left: -10px;
            top: 5px;
            transform: rotate(30deg);
            z-index: 5;
        }

        .bear-white .arm.right {
            right: -10px;
            top: 5px;
            transform: rotate(-20deg);
        }

        /* Floating hearts near bears */
        .mini-heart {
            position: absolute;
            font-size: 16px;
            animation: floatHeart 2s ease-in-out infinite;
            z-index: 3;
        }

        .mini-heart:nth-child(1) {
            top: 5px;
            left: 95px;
            animation-delay: 0s;
        }

        .mini-heart:nth-child(2) {
            top: 15px;
            right: 45px;
            animation-delay: 0.5s;
            font-size: 12px;
        }

        .mini-heart:nth-child(3) {
            top: -5px;
            left: 120px;
            animation-delay: 1s;
            font-size: 20px;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-12px) scale(1.15); opacity: 0.7; }
        }

        /* Bear hug animation */
        .bears {
            animation: bearBounce 3s ease-in-out infinite;
        }

        @keyframes bearBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .question {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin: 25px 0;
            letter-spacing: 0.5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-yes, .btn-no {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #ff4081);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 64, 129, 0.6);
        }

        .btn-no {
            background: linear-gradient(135deg, #ff8a80, #ff5252);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 82, 82, 0.4);
            position: absolute;
            transition: all 0.2s ease;
        }

        .btn-no:hover {
            transform: scale(1.1);
        }

        /* Response screen */
        .response {
            display: none;
            text-align: center;
        }

        .response .message {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin: 20px 0;
        }

        .response .sub-message {
            font-size: 18px;
            color: #777;
            margin-bottom: 15px;
        }

        /* Falling hearts */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .falling-heart {
            position: absolute;
            top: -50px;
            font-size: 30px;
            animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Sparkle animation for yes response */
        @keyframes sparkle {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .sparkle-text {
            animation: sparkle 1s ease-in-out infinite;
            display: inline-block;
        }

        /* Background floating hearts */
        .bg-heart {
            position: fixed;
            font-size: 24px;
            opacity: 0.15;
            animation: bgFloat linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* No button escape animation */
        .btn-no-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Reset button */
        .btn-reset {
            padding: 12px 30px;
            border: 2px solid #ff4081;
            background: transparent;
            color: #ff4081;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-reset:hover {
            background: #ff4081;
            color: white;
        }

        /* Eyes closed (happy) */
        .eyes-happy .eye {
            height: 3px !important;
            width: 8px !important;
            border-radius: 0 !important;
            border-top: 2px solid #333;
            background: transparent !important;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Background floating hearts -->
    <div id="bgHearts"></div>

    <!-- Falling hearts container -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="container">
        <div class="card" id="card">
            <!-- Question Screen -->
            <div id="questionScreen">
                <div class="bears" id="bearsGroup">
                    <span class="mini-heart">&#x1F497;</span>
                    <span class="mini-heart">&#x1F495;</span>
                    <span class="mini-heart">&#x2764;&#xFE0F;</span>

                    <!-- Brown Bear -->
                    <div class="bear-brown">
                        <div class="head">
                            <div class="ear left"><div class="ear-inner"></div></div>
                            <div class="ear right"><div class="ear-inner"></div></div>
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="face"></div>
                            <div class="nose"></div>
                            <div class="mouth"></div>
                            <div class="blush left"></div>
                            <div class="blush right"></div>
                        </div>
                        <div class="body">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                        </div>
                    </div>

                    <!-- White Bear -->
                    <div class="bear-white">
                        <div class="head">
                            <div class="ear left"><div class="ear-inner"></div></div>
                            <div class="ear right"><div class="ear-inner"></div></div>
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="face"></div>
                            <div class="nose"></div>
                            <div class="mouth"></div>
                            <div class="blush left"></div>
                            <div class="blush right"></div>
                        </div>
                        <div class="body">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                        </div>
                    </div>
                </div>

                <div class="question">Do you love me?</div>

                <div class="buttons">
                    <button class="btn-yes" onclick="sayYes()">Yes</button>
                    <div class="btn-no-wrapper">
                        <button class="btn-no" id="noBtn" onmouseover="runAway()" onclick="runAway()">No</button>
                    </div>
                </div>
            </div>

            <!-- Response Screen -->
            <div class="response" id="responseScreen">
                <div class="bears eyes-happy" id="bearsHappy">
                    <span class="mini-heart">&#x1F497;</span>
                    <span class="mini-heart">&#x1F495;</span>
                    <span class="mini-heart">&#x2764;&#xFE0F;</span>

                    <!-- Brown Bear -->
                    <div class="bear-brown">
                        <div class="head">
                            <div class="ear left"><div class="ear-inner"></div></div>
                            <div class="ear right"><div class="ear-inner"></div></div>
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="face"></div>
                            <div class="nose"></div>
                            <div class="mouth"></div>
                            <div class="blush left"></div>
                            <div class="blush right"></div>
                        </div>
                        <div class="body">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                        </div>
                    </div>

                    <!-- White Bear -->
                    <div class="bear-white">
                        <div class="head">
                            <div class="ear left"><div class="ear-inner"></div></div>
                            <div class="ear right"><div class="ear-inner"></div></div>
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="face"></div>
                            <div class="nose"></div>
                            <div class="mouth"></div>
                            <div class="blush left"></div>
                            <div class="blush right"></div>
                        </div>
                        <div class="body">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                        </div>
                    </div>
                </div>

                <div class="message"><span class="sparkle-text">I knew it! &#x1F60D;</span></div>
                <div class="sub-message">I love you too! &#x2764;&#xFE0F;</div>
                <button class="btn-reset" onclick="resetPage()">Ask Again</button>
            </div>
        </div>
    </div>

    <script>
        // Create background floating hearts
        function createBgHearts() {
            const container = document.getElementById('bgHearts');
            const hearts = ['\u2764\uFE0F', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83D\uDC97', '\uD83D\uDC93'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (16 + Math.random() * 24) + 'px';
                heart.style.animationDuration = (8 + Math.random() * 12) + 's';
                heart.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(heart);
            }
        }
        createBgHearts();

        // No button runs away
        function runAway() {
            const btn = document.getElementById('noBtn');
            const card = document.getElementById('card');
            const cardRect = card.getBoundingClientRect();

            const maxX = cardRect.width / 2 - 40;
            const maxY = cardRect.height / 2 - 30;

            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 1.5;

            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Yes button clicked
        function sayYes() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('responseScreen').style.display = 'block';

            // Create falling hearts
            const container = document.getElementById('heartsContainer');
            const hearts = ['\u2764\uFE0F', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83D\uDC97', '\uD83D\uDC93', '\uD83C\uDF39', '\uD83C\uDF38'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'falling-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                    heart.style.animationDuration = (2 + Math.random() * 3) + 's';
                    container.appendChild(heart);

                    setTimeout(() => heart.remove(), 5000);
                }, i * 100);
            }
        }

        // Reset
        function resetPage() {
            document.getElementById('questionScreen').style.display = 'block';
            document.getElementById('responseScreen').style.display = 'none';
            document.getElementById('noBtn').style.transform = 'translate(0, 0)';
            document.getElementById('heartsContainer').innerHTML = '';
        }
    </script>
</body>
</html>
